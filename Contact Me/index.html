<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utkarsh's Portfolio - Contact Me</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="fav.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init({
          publicKey: "H7j5Gz-ERbrKT6xTq",
        });
      })();
    </script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="container">
      <video autoplay muted loop class="bg-video" src="space.mp4"></video>
      <header class="header">
        <div>
          <a href="/Portfolio/index.html" class="brand">Utkarsh's Portfolio</a>
        </div>
        <div class="menu-btn"><i class="fas fa-bars"></i></div>
        <nav>
          <ul>
            <li><a href="/Portfolio/index.html" class="nav-anime">Home</a></li>
            <li><a href="/About/index.html" class="nav-anime">About</a></li>
            <li>
              <a href="/Projects/index.html" class="nav-anime">Projects</a>
            </li>
            <li><a href="#" class="nav-anime">Resume</a></li>
            <li>
              <a href="/Contact Me/index.html" class="nav-anime active"
                >Contact Me</a
              >
            </li>
          </ul>
        </nav>
      </header>
    </div>

    <main id="main">
      <div id="fullbox-div" class="fade-in">
        <h1 class="head floating">Contact Me</h1>
      </div>
      <hr class="hrtag" />

      <div id="full-box" class="fade-in delay-1">
        <div id="left-box">
          <h2 id="cntct-me" class="floating">Connect With Me</h2>

          <div class="contact-grid">
            <div class="contact-item">
              <button>
                <a
                  class="visit-btn"
                  target="_blank"
                  href="mailto:uv23894@gmail.com"
                >
                  <i class="fas fa-envelope social-icon"></i> Email Me
                </a>
              </button>
            </div>

            <div class="contact-item">
              <button>
                <a
                  class="visit-btn"
                  target="_blank"
                  href="https://www.instagram.com/utkarsh77__/"
                >
                  <i class="fab fa-instagram social-icon"></i> Instagram
                </a>
              </button>
            </div>

            <div class="contact-item">
              <button>
                <a
                  class="visit-btn"
                  target="_blank"
                  href="https://www.linkedin.com/in/utkarsh-verma-b71502264/"
                >
                  <i class="fab fa-linkedin social-icon"></i> LinkedIn
                </a>
              </button>
            </div>

            <div class="contact-item">
              <button>
                <a
                  class="visit-btn"
                  target="_blank"
                  href="https://x.com/Utkarsh_07_"
                >
                  <i class="fab fa-twitter social-icon"></i> Twitter
                </a>
              </button>
            </div>
          </div>
        </div>

        <div id="right-box">
          <img id="uv-img" src="utkarshVam.jpg" alt="Utkarsh's Photo" />
        </div>
      </div>

      <div class="contact-form fade-in delay-2">
        <h2
          style="color: white; text-align: center; margin-bottom: 1.5rem"
          class="floating"
        >
          Send Me a Message
        </h2>
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Your Name"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Your Email"
              required
            />
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              class="form-control"
              placeholder="Subject"
              required
            />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              class="form-control"
              placeholder="Your Message"
              required
            ></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </main>

    <hr class="hr-tag" />
    <footer class="footer fade-in delay-3">
      <span class="footer-para"
        >© 2024 Utkarsh's Portfolio, All rights reserved</span
      >
    </footer>
  </body>
</html>
